name: Android tests

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              workflow_dispatch:

              permissions:
                contents: read

                concurrency:
                  group: android-tests-${{ github.ref }}
                    cancel-in-progress: true

                    jobs:
                      tests:
                          runs-on: ubuntu-latest
                              timeout-minutes: 30

                                  steps:
                                        - uses: actions/checkout@v4
                                                with:
                                                          persist-credentials: false

                                                                - uses: actions/setup-java@v5
                                                                        with:
                                                                                  distribution: temurin
                                                                                            java-version: '17'

                                                                                                  - uses: android-actions/setup-android@v3

                                                                                                        - name: Install Android SDK
                                                                                                                run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

                                                                                                                      - name: Create temporary debug key
                                                                                                                              run: |
                                                                                                                                        keytool -genkeypair \
                                                                                                                                                    -keystore debug.keystore \
                                                                                                                                                                -storepass android -keypass android \
                                                                                                                                                                            -alias androiddebugkey \
                                                                                                                                                                                        -dname "CN=Android Debug,O=Android,C=US" \
                                                                                                                                                                                                    -keyalg RSA -keysize 2048 -validity 2

                                                                                                                                                                                                          - name: Run tests
                                                                                                                                                                                                                  shell: bash
                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                    set -o pipefail
                                                                                                                                                                                                                                              bash gradlew :app:testDebugUnitTest \
                                                                                                                                                                                                                                                          --no-daemon --console=plain --stacktrace \
                                                                                                                                                                                                                                                                      2>&1 | tee android-tests.log

                                                                                                                                                                                                                                                                            - name: Save reports
                                                                                                                                                                                                                                                                                    if: always()
                                                                                                                                                                                                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                                                                                              name: android-test-results-${{ github.sha }}
                                                                                                                                                                                                                                                                                                                        retention-days: 14
                                                                                                                                                                                                                                                                                                                                  if-no-files-found: warn
                                                                                                                                                                                                                                                                                                                                            path: |
                                                                                                                                                                                                                                                                                                                                                        android-tests.log
                                                                                                                                                                                                                                                                                                                                                                    app/build/reports/tests/testDebugUnitTest/
                                                                                                                                                                                                                                                                                                                                                                                app/build/test-results/testDebugUnitTest/